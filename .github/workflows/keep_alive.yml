name: Render Backend 24/7 Keep-Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render free tier 15-minute inactivity spin down
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive-ping:
    name: Ping AutoRide Render API
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive HTTP Ping
        run: |
          TARGET_URL="${{ vars.BACKEND_HEALTH_URL || 'https://autoride-backend.onrender.com/api/v1/health' }}"
          echo "=========================================================="
          echo "Dispatching 24/7 Keep-Alive Ping to Prevent Spin-Down"
          echo "Target: $TARGET_URL"
          echo "Time:   $(date -u)"
          echo "=========================================================="

          # 60s timeout allows Render cold-start if sleeping, waking it up instantly
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 60 --retry 3 --retry-delay 5 "$TARGET_URL")
          echo "Response HTTP Status: $STATUS"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "SUCCESS: AutoRide backend is LIVE and HOT!"
          else
            echo "HTTP Status $STATUS received"
            exit 0
          fi
